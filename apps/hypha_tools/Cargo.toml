[package]
name = "hypha_tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
description = "Tools for hypha: introspection, recording, replay, launch orchestration, Foxglove bridge, and monitoring."

[dependencies]
hypha_node = { path = "../../crates/hypha_node" }

clap = { workspace = true }
mcap = { version = "0.25", features = ["lz4", "zstd"] }
# Reads ROS 2 bags (rosbag2 SQLite) for `hypha convert`; SQLite is compiled in.
rusqlite = { version = "=0.41.1", features = ["bundled"] }
tungstenite = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "=0.9.12"
crossterm = "0.29"
ratatui = "0.30"
nix = { version = "0.29", features = ["signal", "process", "fs", "term", "time"] }
rustix = { version = "1.1.4", default-features = false, features = ["std", "process", "event"] }
signal-hook = "0.3"

[dev-dependencies]
hypha_testkit = { path = "../../crates/hypha_testkit" }
proptest = { workspace = true }

# This crate repeats the workspace lints; it forbids `unsafe`, as the workspace does.
# Its two operating-system calls that need it (the recording's memory map and a
# node's parent-death signal) are in hypha_sys, reached through hypha_node::sdk::sys.
[lints.rust]
dead_code = "deny"
unsafe_code = "forbid"
missing_docs = "deny"
unreachable_pub = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
exit = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
todo = "deny"
unimplemented = "deny"
missing_safety_doc = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
non_send_fields_in_send_ty = "deny"
needless_pass_by_value = "allow"
module_name_repetitions = "allow"
