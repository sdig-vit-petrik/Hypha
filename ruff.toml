# Ruff settings for the Python files of this repository. The formatter
# (scripts/format.sh) applies these settings to every tracked Python file.

target-version = "py312"
line-length = 100

[lint]
select = [
    "ANN",
    "B",
    "C4",
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "PIE",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "UP",
]
ignore = ["ANN401"]

[lint.per-file-ignores]
"**/tests/**/*.py" = ["ANN", "S101"]
