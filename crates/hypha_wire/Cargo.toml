[package]
name = "hypha_wire"
description = "The wire layer: frame framing, ROS 1 primitive codec, and message identity."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
# CRC-32C: PMULL (aarch64) or PCLMULQDQ (x86_64) folding fused with the CRC instructions,
# chosen at run time (`std` for that detection), a table where neither exists.
crc-fast = { version = "1.10.0", default-features = false, features = ["std"] }

[dev-dependencies]
# The implementation before crc-fast: a test pins the two to the same value.
crc32c = "0.6.8"
criterion = { workspace = true }
proptest = { workspace = true }

[[bench]]
name = "codec"
harness = false

[[bench]]
name = "integrity"
harness = false

[lints]
workspace = true
