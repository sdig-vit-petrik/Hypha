[package]
name = "hypha_sys"
description = "The operating-system calls of hypha that need `unsafe`, behind a safe API: the signal handlers, a read-only file map and the parent-death signal of a child."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
libc = "0.2"

# The workspace forbids `unsafe`. This crate holds the operating-system calls that
# cannot be made without it, so it cannot. Each `unsafe` block does one operation and
# says why it is sound. Every other lint the workspace sets is repeated here, so
# relaxing one does not relax the rest.
[lints.rust]
dead_code = "deny"
missing_docs = "deny"
unreachable_pub = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
exit = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
todo = "deny"
unimplemented = "deny"
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
non_send_fields_in_send_ty = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
needless_pass_by_value = "allow"
module_name_repetitions = "allow"
