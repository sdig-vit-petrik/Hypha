[package]
name = "hypha_iceoryx2"
description = "The transport port over iceoryx2 shared memory."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
hypha_core = { path = "../hypha_core" }
hypha_wire = { path = "../hypha_wire" }
hypha_time = { path = "../hypha_time" }
hypha_msgdef = { path = "../hypha_msgdef" }

iceoryx2 = { version = "0.10.0", default-features = false, features = ["std", "log"] }
log = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", default-features = false, features = ["std", "fs", "process"] }

[dev-dependencies]
hypha_testkit = { path = "../hypha_testkit" }
hypha_log = { path = "../hypha_log" }
iceoryx2-bb-posix = "=0.10.0"
iceoryx2-cal = "=0.10.0"
toml = { workspace = true }

[[bin]]
name = "hypha_iceoryx2_crash_node_helper"
path = "tests/support/crash_node_helper.rs"
test = false

[lints]
workspace = true
