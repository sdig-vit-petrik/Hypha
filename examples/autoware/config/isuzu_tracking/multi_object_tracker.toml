[input_channels.lidar_clustering]
associator_type = "polar"

[input_channels.lidar_clustering.flags]
can_spawn_new_tracker = true
can_trust_existence_probability = false
can_trust_extension = false
can_trust_classification = true
can_trust_orientation = false

[input_channels.lidar_clustering.optional]
name = "clustering"
short_name = "Lcl"

# The one input: Autoware's clustering objects, in detection01 (above; the node names
# the channel parameters with slashes, so each is one quoted key).

[ports.inputs."input.detection01.objects"]
topic = "/perception/object_recognition/detection/clustering/objects"

[ports.outputs."output.objects"]
topic = "/perception/object_recognition/tracking/objects"
