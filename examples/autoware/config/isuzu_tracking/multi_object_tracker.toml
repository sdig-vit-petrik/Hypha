# autoware_multi_object_tracker (Universe 0.53.2): autoware_launch 0.53.0's
# multi_object_tracker_node.param.yaml over the package's own, its
# data_association_matrix.param.yaml, and of input_channels.param.yaml the one channel this
# launch feeds, lidar_clustering, as the rule-based detection does; converted from the YAML
# files by a script, not by hand. The tracker tracks in map from the EKF's /tf. Left out: the polygon tracker's polygon hazard profile, which no
# assignment matches (a polygon hazard goes to the static tracker), so the node never reads it.

# Upstream's launch file passes it as an argument, false by default.
publish_merged_objects = false
"input/detection01/channel" = "lidar_clustering"
"input/detection02/channel" = "none"
"input/detection03/channel" = "none"
"input/detection04/channel" = "none"
"input/detection05/channel" = "none"
"input/detection06/channel" = "none"
"input/detection07/channel" = "none"
"input/detection08/channel" = "none"
"input/detection09/channel" = "none"
"input/detection10/channel" = "none"
"input/detection11/channel" = "none"
"input/detection12/channel" = "none"
world_frame_id = "map"
ego_frame_id = "base_link"
publish_on_timer = true
publish_rate = 10.0
ego_source = "tf"
delay_compensation = "full"
consider_odometry_uncertainty = false
pruning_pedestrian_pair_min_iou = 0.1
pruning_known_pair_min_iou = 0.1
pruning_unknown_pair_min_giou = 0.1
pruning_unknown_pair_max_gap = 1.0
publish_processing_time = true
publish_processing_time_detail = false
publish_tentative_objects = false
publish_debug_markers = false
diagnostics_warn_delay = 0.5
diagnostics_error_delay = 1.0
diagnostics_warn_extrapolation = 0.5
diagnostics_error_extrapolation = 1.0
unknown_association_giou_threshold = -0.8

[tracker_configs.polygon_tracker]
enable_velocity_estimation = true

[tracker_configs.polygon_tracker.enable_motion_output]
unknown = false
car = true
truck = true
bus = true
trailer = true
motorcycle = true
bicycle = true
pedestrian = true
animal = true
hazard = false

[tracker_configs.static_tracker]
convert_polygon_to_bbox = false

[tracker_assignment.bounding_box.unknown]
create = "general_vehicle_tracker"
match = ["general_vehicle_tracker", "pedestrian_and_bicycle_tracker"]

[tracker_assignment.bounding_box.car]
create = "general_vehicle_tracker"
match = ["general_vehicle_tracker"]

[tracker_assignment.bounding_box.truck]
create = "general_vehicle_tracker"
match = ["general_vehicle_tracker"]

[tracker_assignment.bounding_box.bus]
create = "general_vehicle_tracker"
match = ["general_vehicle_tracker"]

[tracker_assignment.bounding_box.trailer]
create = "general_vehicle_tracker"
match = ["general_vehicle_tracker"]

[tracker_assignment.bounding_box.motorcycle]
create = "pedestrian_and_bicycle_tracker"
match = ["pedestrian_and_bicycle_tracker"]

[tracker_assignment.bounding_box.bicycle]
create = "pedestrian_and_bicycle_tracker"
match = ["pedestrian_and_bicycle_tracker"]

[tracker_assignment.bounding_box.pedestrian]
create = "pedestrian_and_bicycle_tracker"
match = ["pedestrian_and_bicycle_tracker"]

[tracker_assignment.bounding_box.animal]
create = "null"

[tracker_assignment.bounding_box.hazard]
create = "static_tracker"
match = ["static_tracker"]

[tracker_assignment.polygon.unknown]
create = "polygon_tracker"
match = ["polygon_tracker", "static_tracker", "general_vehicle_tracker", "pedestrian_and_bicycle_tracker"]

[tracker_assignment.polygon.car]
create = "polygon_tracker"
match = ["polygon_tracker", "general_vehicle_tracker"]

[tracker_assignment.polygon.truck]
create = "polygon_tracker"
match = ["polygon_tracker", "general_vehicle_tracker"]

[tracker_assignment.polygon.bus]
create = "polygon_tracker"
match = ["polygon_tracker", "general_vehicle_tracker"]

[tracker_assignment.polygon.trailer]
create = "polygon_tracker"
match = ["polygon_tracker", "general_vehicle_tracker"]

[tracker_assignment.polygon.motorcycle]
create = "polygon_tracker"
match = ["polygon_tracker", "pedestrian_and_bicycle_tracker"]

[tracker_assignment.polygon.bicycle]
create = "polygon_tracker"
match = ["polygon_tracker", "pedestrian_and_bicycle_tracker"]

[tracker_assignment.polygon.pedestrian]
create = "polygon_tracker"
match = ["polygon_tracker", "pedestrian_and_bicycle_tracker"]

[tracker_assignment.polygon.animal]
create = "polygon_tracker"
match = ["polygon_tracker"]

[tracker_assignment.polygon.hazard]
create = "static_tracker"
match = ["static_tracker"]

[tracker_assignment.cylinder.unknown]
create = "null"

[tracker_assignment.cylinder.car]
create = "null"

[tracker_assignment.cylinder.truck]
create = "null"

[tracker_assignment.cylinder.bus]
create = "null"

[tracker_assignment.cylinder.trailer]
create = "null"

[tracker_assignment.cylinder.motorcycle]
create = "pedestrian_and_bicycle_tracker"
match = ["pedestrian_and_bicycle_tracker"]

[tracker_assignment.cylinder.bicycle]
create = "pedestrian_and_bicycle_tracker"
match = ["pedestrian_and_bicycle_tracker"]

[tracker_assignment.cylinder.pedestrian]
create = "pedestrian_and_bicycle_tracker"
match = ["pedestrian_and_bicycle_tracker"]

[tracker_assignment.cylinder.animal]
create = "null"

[tracker_assignment.cylinder.hazard]
create = "static_tracker"
match = ["static_tracker"]

