# autoware_ground_filter_node_test: the ground filter on the bus, with the deployment values.

# The filter: upstream config/ground_filter.param.yaml.
global_slope_max_angle_deg = 10.0
local_slope_max_angle_deg = 13.0
split_points_distance_tolerance = 0.2
use_virtual_ground_point = true
split_height_distance = 0.2
non_ground_height_threshold = 0.20
grid_size_m = 0.5
grid_mode_switch_radius = 20.0
ground_grid_buffer_size = 4
detection_range_z_max = 2.5
elevation_grid_mode = true
low_priority_region_x = -20.0
center_pcl_shift = 0.0
radial_divider_angle_deg = 1.0
use_recheck_ground_cluster = true
use_lowest_point = true
publish_processing_time_detail = false

# The node defaults: one input, no indices.
max_queue_size = 5
use_indices = false
latched_indices = false
approximate_sync = false

# The vehicle: upstream autoware_vehicle_info_utils config/vehicle_info.param.yaml.
wheel_radius = 0.39
wheel_width = 0.42
wheel_base = 2.74
wheel_tread = 1.63
front_overhang = 1.0
rear_overhang = 1.03
left_overhang = 0.1
right_overhang = 0.1
vehicle_height = 2.5
max_steer_angle = 0.70

[ports.inputs.input]
topic = "/test/ground_filter/input"

[ports.outputs.output]
topic = "/test/ground_filter/output"
