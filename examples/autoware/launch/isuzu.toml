# Watch the Autoware port on a replayed Isuzu bag: detection (Slice A's ground filter and
# voxel downsample, then the full stack's clustering, shape estimation and feature remover),
# tracking (the multi-object tracker in map, #114), the localization of #110 (the Applanix
# driver's outputs, the map projection, the GNSS poser, the gyro odometer, the EKF and its
# start), the Foxglove bridge and the player, one tmux window each. Start it with examples/autoware/launch.sh,
# which puts the build's executables on PATH, checks ISUZU_INPUT and runs hypha launch in
# examples/autoware:
#
#   examples/autoware/launch.sh up --attach
#   examples/autoware/launch.sh down
#
# Executables are found on PATH; files are relative to examples/autoware. This is an
# open-loop launch: the player and every node run with HYPHA_REPLAY_LOCKSTEP=0, and the
# nodes follow the player's /clock (HYPHA_USE_SIM_TIME=1) as ROS nodes follow
# ros2 bag play. The nodes are plain callback nodes, and the lockstep cannot run the
# localization's /tf loop between them: it has no rate cycle as its delay element. A
# launch file has no launch-wide environment, so each unit sets the switch.
# Each loop of the player sends /clock back: every node on /clock exits 75, as nothing
# rewinds in place (#130), and its window starts it again at once. The bridge and the
# player run on host time.

# --- Detection: Slice A -----------------------------------------------------------------

[[units]]
name = "ground_filter"
exec = "autoware_ground_filter"
args = ["config/slice_a/ground_filter.toml"]
restart = "on-failure"
[units.env]
HYPHA_USE_SIM_TIME = "1"
HYPHA_REPLAY_LOCKSTEP = "0"

[[units]]
name = "voxel_grid_downsample_filter"
exec = "autoware_voxel_grid_downsample_filter"
args = ["config/slice_a/voxel_grid_downsample_filter.toml"]
restart = "on-failure"
[units.env]
HYPHA_USE_SIM_TIME = "1"
HYPHA_REPLAY_LOCKSTEP = "0"

# --- Tracking (#114): Autoware 2.1.0's rule-based detection into the tracker --------------
# Universe's clustering, which keeps the cluster points, in place of Slice A's Core one.

[[units]]
name = "euclidean_cluster"
exec = "autoware_universe_voxel_grid_based_euclidean_cluster"
args = ["config/isuzu_tracking/euclidean_cluster.toml"]
restart = "on-failure"
[units.env]
HYPHA_USE_SIM_TIME = "1"
HYPHA_REPLAY_LOCKSTEP = "0"

[[units]]
name = "shape_estimation"
exec = "autoware_shape_estimation"
args = ["config/isuzu_tracking/shape_estimation.toml"]
restart = "on-failure"
[units.env]
HYPHA_USE_SIM_TIME = "1"
HYPHA_REPLAY_LOCKSTEP = "0"

[[units]]
name = "detected_object_feature_remover"
exec = "autoware_detected_object_feature_remover"
args = ["config/isuzu_tracking/detected_object_feature_remover.toml"]
restart = "on-failure"
[units.env]
HYPHA_USE_SIM_TIME = "1"
HYPHA_REPLAY_LOCKSTEP = "0"

[[units]]
name = "multi_object_tracker"
exec = "autoware_multi_object_tracker"
args = ["config/isuzu_tracking/multi_object_tracker.toml"]
restart = "on-failure"
[units.env]
HYPHA_USE_SIM_TIME = "1"
HYPHA_REPLAY_LOCKSTEP = "0"

# --- Localization: GNSS and the Applanix INS into the EKF (#110) --------------------------

[[units]]
name = "map_projection_loader"
exec = "autoware_map_projection_loader"
args = ["config/isuzu_localization/map_projection_loader.toml"]
restart = "on-failure"
[units.env]
HYPHA_USE_SIM_TIME = "1"
HYPHA_REPLAY_LOCKSTEP = "0"

[[units]]
name = "lvx_client"
exec = "applanix_lvx_client_replay"
args = ["config/isuzu_localization/lvx_client.toml"]
restart = "on-failure"
[units.env]
HYPHA_USE_SIM_TIME = "1"
HYPHA_REPLAY_LOCKSTEP = "0"

[[units]]
name = "gnss_poser"
exec = "autoware_gnss_poser"
args = ["config/isuzu_localization/gnss_poser.toml"]
restart = "on-failure"
[units.env]
HYPHA_USE_SIM_TIME = "1"
HYPHA_REPLAY_LOCKSTEP = "0"

[[units]]
name = "gyro_odometer"
exec = "autoware_gyro_odometer"
args = ["config/isuzu_localization/gyro_odometer.toml"]
restart = "on-failure"
[units.env]
HYPHA_USE_SIM_TIME = "1"
HYPHA_REPLAY_LOCKSTEP = "0"

[[units]]
name = "ekf_localizer"
exec = "autoware_ekf_localizer"
args = ["config/isuzu_localization/ekf_localizer.toml"]
restart = "on-failure"
[units.env]
HYPHA_USE_SIM_TIME = "1"
HYPHA_REPLAY_LOCKSTEP = "0"

[[units]]
name = "gnss_pose_initializer"
exec = "gnss_pose_initializer"
args = ["config/isuzu_localization/gnss_pose_initializer.toml"]
restart = "on-failure"
after = ["ekf_localizer"]
[units.env]
HYPHA_USE_SIM_TIME = "1"
HYPHA_REPLAY_LOCKSTEP = "0"

# --- Foxglove and the player --------------------------------------------------------------

# Foxglove: connect to ws://localhost:8765 and import foxglove_layout.json.
[[units]]
name = "foxglove_bridge"
exec = "hypha"
args = ["foxglove"]
restart = "on-failure"

# The recording in a loop at real time. /clock advances 20 ms at a time, so the EKF's 50 Hz
# timer runs every period. A unit runs in the background of its window, so the player takes
# no keys there.
[[units]]
name = "player"
exec = "/bin/sh"
restart = "on-failure"
args = ["-c", 'exec hypha play --input "$ISUZU_INPUT" --clock --rate 1 --chunk 20 --loop']
after = ["ground_filter", "voxel_grid_downsample_filter", "euclidean_cluster", "shape_estimation", "detected_object_feature_remover", "multi_object_tracker", "map_projection_loader", "lvx_client", "gnss_poser", "gyro_odometer", "ekf_localizer", "gnss_pose_initializer", "foxglove_bridge"]
[units.env]
HYPHA_REPLAY_LOCKSTEP = "0"
