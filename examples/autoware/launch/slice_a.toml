# Watch Slice A on a replayed bag: the ground filter, the voxel downsample, the
# clustering, the Foxglove bridge and the player, one tmux window each. Start it with
# examples/autoware/launch.sh, which puts the build's executables on PATH, checks
# SLICE_A_INPUT and runs hypha launch in examples/autoware:
#
#   examples/autoware/launch.sh up --attach
#   examples/autoware/launch.sh down
#
# Executables are found on PATH; files are relative to examples/autoware. The nodes
# follow the player's /clock (HYPHA_USE_SIM_TIME); the bridge and the player run on
# host time.

[[units]]
name = "ground_filter"
exec = "autoware_ground_filter"
args = ["config/slice_a/ground_filter.toml"]
restart = "on-failure"
[units.env]
HYPHA_USE_SIM_TIME = "1"

[[units]]
name = "voxel_grid_downsample_filter"
exec = "autoware_voxel_grid_downsample_filter"
args = ["config/slice_a/voxel_grid_downsample_filter.toml"]
restart = "on-failure"
[units.env]
HYPHA_USE_SIM_TIME = "1"

[[units]]
name = "euclidean_cluster"
exec = "autoware_voxel_grid_based_euclidean_cluster"
args = ["config/slice_a/voxel_grid_based_euclidean_cluster.toml"]
restart = "on-failure"
[units.env]
HYPHA_USE_SIM_TIME = "1"

# Foxglove: connect to ws://localhost:8765 and import foxglove_layout.json.
[[units]]
name = "foxglove_bridge"
exec = "hypha"
args = ["foxglove"]
restart = "on-failure"

# The recording in a loop at real time, in the replay lockstep with the three nodes
# (#72). Each pass sends /clock back: the nodes exit 75 and their windows start them
# again at once. stdin is /dev/null: a unit runs in the background of its window, so
# the player's keys never reach it, and a key typed there hangs it (#109).
[[units]]
name = "player"
exec = "/bin/sh"
restart = "on-failure"
args = ["-c", 'exec hypha play --input "$SLICE_A_INPUT" --clock --rate 1 --loop --nodes ground_filter voxel_grid_downsample_filter voxel_grid_based_euclidean_cluster_node </dev/null']
after = ["ground_filter", "voxel_grid_downsample_filter", "euclidean_cluster", "foxglove_bridge"]
