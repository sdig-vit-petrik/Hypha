# The rated load of NFR-04 as a workload of `hypha load`, with the pass limits of
# NFR-03 and NFR-04 (docs/requirements-specification.md):
#
#   scripts/rated-load.sh [report.json]   (the release build of ./build.sh)
#
# NFR-04 names three totals: 46 topics, 72.5 MB/s and 9,960 messages/s, the figures
# of one application. The repository records only the totals, so the split below is
# constructed: generic topic groups whose sums are exactly those figures (MB = 10^6
# bytes). load_workload.rs recomputes them from this file.
#
#   group        topics  rate (Hz)      bytes     messages/s        bytes/s
#   lidar             2         10    1200000             20     24,000,000
#   camera            2         30     700000             60     42,000,000
#   radar             4         20      40000             80      3,200,000
#   imu               2       1000        200          2,000        400,000
#   control           4       1000        100          4,000        400,000
#   odometry          8        250        300          2,000        600,000
#   state             8        100       1500            800      1,200,000
#   status            8        100        500            800        400,000
#   diagnostics       8         25       1500            200        300,000
#   total            46                                9,960     72,500,000
#
# Every reader keeps pace: no work per sample, the service's deepest queue (depth 0,
# 32), at most two subscribers per topic (a topic admits three that declare no
# policy), and no recorder, which NFR-04 does not name as a consumer.
#
# Limits: NFR-03 latency_p99_us = 500, from the send call to callback entry; NFR-04
# zero loss for every reader, every loss accounted, no refused publish; and no missed
# period: a run whose publishers missed periods did not offer the rated load, so it
# shows nothing about sustaining it.
#
# A result counts for NFR-03 and NFR-04 only on the reference platform, which is not
# defined yet. A run on any other host is a
# measurement of that host: the report's `host` block names it.

[run]
duration_s = 60.0
warmup_s = 5.0
cooldown_s = 1.0
sample_interval_s = 1.0
bounded_memory = false

[[process]]
name = "sensors"

[[process]]
name = "perception"

[[process]]
name = "planner"

[[process]]
name = "vehicle"

[[process]]
name = "monitor"

# lidar: point clouds.
[[topic]]
name = "/rated/lidar_0"
bytes = 1200000
rate_hz = 10
publisher = "sensors"
subscribers = [{ process = "perception" }, { process = "planner" }]

[[topic]]
name = "/rated/lidar_1"
bytes = 1200000
rate_hz = 10
publisher = "sensors"
subscribers = [{ process = "perception" }, { process = "planner" }]

