[workspace]
resolver = "2"
members = ["crates/hypha_time", "crates/hypha_wire", "crates/hypha_msgdef", "crates/hypha_msggen", "crates/hypha_core", "crates/hypha_cycle", "crates/hypha_runtime","crates/hypha_node", "crates/hypha_ffi", "crates/hypha_testkit", "crates/hypha_iceoryx2", "crates/hypha_msgs", "crates/hypha_log", "crates/hypha_sys", "crates/hypha_testing_mcap",
    "apps/hypha_tools", "apps/hypha_ros_bridge"]
# The fuzz targets are a workspace of their own (fuzz/Cargo.toml, scripts/fuzz.sh).
# vendor/ holds patched third-party crates (vendor/README.md), not workspace members.
exclude = ["fuzz", "vendor"]

# iceoryx2-cal with a smaller reallocation limit: vendor/README.md.
[patch.crates-io]
iceoryx2-cal = { path = "vendor/iceoryx2-cal" }


[workspace.dependencies]
log = "0.4"
clap = { version = "4.5", features = ["derive"] }
toml = "=0.9.12"
# Benchmarks only (dev-dependency): no plots, no thread pool.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
# Property tests only (dev-dependency): no fork or timeout runner.
proptest = { version = "1.9", default-features = false, features = ["std"] }

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false
repository = "https://github.com/sdig-vit-petrik/Hypha"


# The delivered library: one optimisation unit across all crates and no symbol
# table. A panic aborts the process (SIGABRT): no entry point catches it, so the
# ABI never reports one as a status. `panic = "abort"` in the dev profile would build
# `hypha_ffi` twice per test build, aborting and unwinding, into the same
# unhashed `cdylib`/`rlib` file names, and the two builds overwrite each other.
[profile.release]
panic = "abort"
lto = "fat"
codegen-units = 1
strip = true

# Every integration test is a binary that links the whole dependency tree: with full
# debug info a cold test build wrote 24.8 GB. Without debug info a panic still names its
# file and line; backtraces and sanitizer reports name functions only. Other debug
# builds keep full debug info, so `cargo test` and `cargo build` compile the
# dependencies once each, and the unhashed libhypha_ffi.so of one is relinked by the
# other: the same code, unlike a differing panic strategy (above).
[profile.test]
debug = false

[workspace.lints.rust]
unsafe_code = "forbid"
dead_code = "deny"
missing_docs = "deny"
unreachable_pub = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
exit = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
todo = "deny"
unimplemented = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
non_send_fields_in_send_ty = "deny"
needless_pass_by_value = "allow"
module_name_repetitions = "allow"
