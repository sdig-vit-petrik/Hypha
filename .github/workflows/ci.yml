# The gate of hypha, in the builder image of docker/Dockerfile: the style and
# generated-file checks, then the Rust and C++ suites with the installed SDK flow. With
# it, on every push and pull request: a macOS build with clippy. Nightly on develop and
# on demand: the C++ suite on arm64 and the qualification run, its report an artifact.
# main takes pull requests from this repository's develop only (docs/release-policy.md).
name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# The event is part of the group, so a push does not cancel the nightly run.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  # A pull request from a fork has no token that can push the builder image.
  OWN_REPOSITORY: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

jobs:
  source-branch:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-24.04
    steps:
      - name: The pull request comes from develop
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [[ "$HEAD_REF" != develop || "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]]; then
            echo "::error::main takes pull requests from develop only, not from $HEAD_REPO:$HEAD_REF"
            exit 1
          fi

  # Guard against unreviewed PR bloat into develop (release PRs into main are excluded).
  # Add the `large-pr-approved` label to allow an intentionally larger change.
  pr-size:
    if: github.event_name == 'pull_request' && github.base_ref == 'develop'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check net diff size and ABI surface delta
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          python3 -I - <<'PY'
          import os, re, subprocess, sys

          base, head = os.environ["BASE_SHA"], os.environ["HEAD_SHA"]
          labels = set(filter(None, os.environ.get("LABELS", "").split(",")))
          out = subprocess.check_output(["git", "diff", "--numstat", f"{base}...{head}"], text=True)

          prod = tests = docs = other = 0
          for line in out.splitlines():
              parts = line.split("\t")
              if len(parts) != 3 or parts[0] == "-":
                  continue
              net = int(parts[0]) - int(parts[1])
              p = parts[2]
              if p.startswith(("crates/hypha-cxx/upstream/", "examples/autoware/")):
                  continue
              if p.startswith("docs/"):
                  docs += net
              elif "/tests/" in p or "/test/" in p or p.startswith("test/") or p.endswith(("_test.cpp", "_tests.rs")):
                  tests += net
              elif p.startswith(("crates/", "apps/")):
                  prod += net
              else:
                  other += net

          total = prod + tests + docs + other

          def abi_count(rev):
              txt = subprocess.check_output(["git", "show", f"{rev}:crates/hypha_ffi/include/hypha/hypha_ffi.h"], text=True)
              return len(set(re.findall(r"\b(hypha_[a-z0-9_]+)\(", txt)))

          abi_delta = abi_count(head) - abi_count(base)
          summary = (
              f"### PR size & surface\n"
              f"- **Net LOC**: `{total:+d}` (prod `{prod:+d}`, tests `{tests:+d}`, docs `{docs:+d}`, other `{other:+d}`)\n"
              f"- **C ABI functions delta**: `{abi_delta:+d}`\n"
          )
          print(summary)
          step_summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if step_summary:
              with open(step_summary, "a", encoding="utf-8") as f:
                  f.write(summary)

          if (total > 800 or prod > 400) and "large-pr-approved" not in labels:
              print(
                  f"::error::PR exceeds size budget (net {total:+d} > 800 or prod {prod:+d} > 400). "
                  f"Slice the PR, trim bloat, or apply the 'large-pr-approved' label.",
                  file=sys.stderr,
              )
              sys.exit(1)
          PY

  gate:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # The image of this docker/ definition from the registry; built and pushed once
      # when docker/ changed.
      - name: The builder image
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          push=()
          if [[ "$OWN_REPOSITORY" == true ]]; then
            echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            push=(--push)
          fi
          echo "HYPHA_BUILDER_IMAGE=$(./docker/build.sh --pull "${push[@]}" builder)" >> "$GITHUB_ENV"

      # in-image.sh runs the image as the runner user, who owns the checkout (git refuses
      # a repository of another owner), with a 2 GB /dev/shm for the transport tests.
      - name: check.sh
        run: scripts/in-image.sh ./check.sh

      - name: test.sh
        run: scripts/in-image.sh ./test.sh

  # macOS is a development platform without a guarantee (docs/release-policy.md section 3):
  # the workspace builds and lints there, so Linux-only code stays gated.
  macos:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # The exact version rust-toolchain.toml pins, with its components, installed
      # explicitly; its version is in the log next to the result.
      - name: The Rust toolchain
        run: |
          rustup toolchain install --profile minimal
          rustc --version
          rustup toolchain install "$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml).0" --profile minimal

      - name: clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: The MSRV builds the workspace
        run: cargo "+$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml).0" check --locked --workspace --all-targets

  # The C++ SDK on the other architecture of the builder image.
  cxx-arm64:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: The builder image
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          echo "HYPHA_BUILDER_IMAGE=$(./docker/build.sh --pull --push builder)" >> "$GITHUB_ENV"

      - name: test.sh cpp
        run: scripts/in-image.sh ./test.sh cpp

  # Coverage, Miri, fuzzing, ASan and TSan. A release attaches the report of its commit.
  qualification:
    # if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: The builder image
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          echo "HYPHA_BUILDER_IMAGE=$(./docker/build.sh --pull --push builder)" >> "$GITHUB_ENV"

      # A cold run needs about 31 GB of disk with incremental builds off, more than the
      # runner has free; the job uses none of the preinstalled SDKs.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h "$GITHUB_WORKSPACE"

      # 3: verified but the requirements with no test yet, each with its recorded gap.
      - name: qualify.sh
        run: |
          status=0
          scripts/in-image.sh env CARGO_INCREMENTAL=0 scripts/qualify.sh || status=$?
          echo "qualify.sh exit status: $status"
          [[ "$status" -eq 0 || "$status" -eq 3 ]]

      - name: The qualification report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qualification-${{ github.sha }}
          path: target/qualification/
          if-no-files-found: error
