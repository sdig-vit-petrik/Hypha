# The gate of hypha, in the builder image of docker/Dockerfile: the style and
# generated-file checks, then the Rust and C++ suites with the installed SDK flow.
# main takes pull requests from this repository's develop only (docs/release-policy.md).
name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-branch:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-24.04
    steps:
      - name: The pull request comes from develop
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [[ "$HEAD_REF" != develop || "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]]; then
            echo "::error::main takes pull requests from develop only, not from $HEAD_REPO:$HEAD_REF"
            exit 1
          fi

  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # A local image: HYPHA_IMAGE_TAG names it, and nothing is pushed.
      - name: Build the builder image
        run: echo "HYPHA_BUILDER_IMAGE=$(HYPHA_IMAGE_TAG=ci ./docker/build.sh builder)" >> "$GITHUB_ENV"

      - name: check.sh
        run: docker run --rm -v "$PWD:/work" -w /work "$HYPHA_BUILDER_IMAGE" ./check.sh

      # The transport tests need shared memory: a /dev/shm larger than Docker's 64 MB.
      - name: test.sh
        run: docker run --rm --shm-size=2g -v "$PWD:/work" -w /work "$HYPHA_BUILDER_IMAGE" ./test.sh
