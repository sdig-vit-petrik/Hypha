# Non-functional requirements

[[requirement]]
id = "NFR-01"
evidence = "Inspection: `libhypha_ffi` is the one deliverable; the C++ SDK uses it through `include/hypha/backend/`"

[[requirement]]
id = "NFR-02"
tests = ["run:miri", "run:asan", "run:tsan"]
evidence = "Rust core; `unsafe` forbidden by lint level outside `hypha_ffi` (the C boundary), `hypha_sys` (OS calls), the test-only `hypha_testkit/src/env.rs` and the C boundary module `hypha_testing_mcap/src/ffi.rs` of the test-only MCAP reader; `hypha_node` and the tools forbid it; sanitizer and Miri runs, 2026-11-11 (R1); `scripts/miri.sh` (Miri over the crates without transport and the node-free `hypha_node` tests); `scripts/sanitize.sh` (C++ tests)"
gap = "Miri and the sanitizers are not in CI; Miri cannot run a node, `hypha_ffi` or `hypha_sys` (P4)."

[[requirement]]
id = "NFR-03"
gap = "No automated evidence. macOS 3-hop p99 2–6 ms; no Linux measurement (R7)."

[[requirement]]
id = "NFR-04"
gap = "No automated evidence (R7)."

