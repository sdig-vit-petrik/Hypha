# Requirements traceability: the source of docs/traceability.md and of the
# qualification report (scripts/traceability.py).
#
# One [[requirement]] per ID of docs/requirements-specification.md, in its order.
#   tests    Test references, each checked against the tree and against the results:
#              <crate>/<binary>   a Rust test binary, <crate>/tests/<binary>.rs
#              <crate>/*          every test of the crate; * also works inside a name
#              cxx:<file>         a gtest source file of crates/hypha-cxx, without .cpp
#              run:<name>         a whole run of the qualification, passed to the report
#                                 as --run <name>=pass|fail: check, coverage, miri,
#                                 fuzz, asan, tsan
#   evidence Evidence no test result can show: analysis, inspection, a run by hand.
#   gap      What the stated verification method still lacks. Empty: nothing known.
# The letters and numbers in brackets (R1, P4, ...) are the items of the former
# backlog document.

