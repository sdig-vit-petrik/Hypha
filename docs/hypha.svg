<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d">
  <title id="t">Hypha</title>
  <desc id="d">One host under a night sky with mountains. Inside it, C++ and Rust nodes are joined by glowing mycelium threads to one iceoryx2 shared-memory segment, with no broker in between. hypha_ros_bridge connects the bus to a ROS 1 graph outside the host, and the Foxglove bridge streams it over a WebSocket to a developer laptop running Foxglove.</desc>
  <defs>
    <radialGradient id="sky" cx="0.7" cy="0.2" r="1">
      <stop offset="0" stop-color="#211b33"/>
      <stop offset="1" stop-color="#0f0c17"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" x2="1">
      <stop offset="0" stop-color="#ffc46b" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffc46b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0912"/>
      <stop offset="1" stop-color="#140f22"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .hypha { fill: none; stroke: #7cf5b4; stroke-linecap: round; }
      .main { stroke-width: 2.5; opacity: 0.55; }
      .fil { stroke-width: 1; opacity: 0.35; }
      .pulse { stroke-width: 3; stroke-dasharray: 6 70; animation: flow 2.6s linear infinite; }
      .slow { animation-duration: 3.4s; }
      .blink { animation: blink 2.6s ease-in-out infinite; }
      .tx { animation: tx 3s linear infinite; }
      .rx { animation: rx 3s linear infinite; }
      .late { animation-delay: -1.5s; }
      .wire { stroke-dasharray: 4 10; animation: wire 1.2s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -76; } }
      @keyframes blink { 50% { opacity: 0.25; } }
      @keyframes tx { from { transform: translateX(0); opacity: 0; } 15%, 85% { opacity: 1; } to { transform: translateX(-100px); opacity: 0; } }
      @keyframes rx { from { transform: translateX(0); opacity: 0; } 15%, 85% { opacity: 1; } to { transform: translateX(100px); opacity: 0; } }
      .up { animation-name: up; }
      @keyframes wire { to { stroke-dashoffset: 14; } }
      .scan { animation: scan 2s linear infinite; }
      .drive { animation: drive 1.6s linear infinite; }
      .draw { stroke-dasharray: 100; animation: draw 4s ease-out infinite; }
      @keyframes scan { from { transform: translateY(0); opacity: 0.6; } to { transform: translateY(100px); opacity: 0; } }
      @keyframes drive { from { transform: translateY(-6px); opacity: 0; } 50% { opacity: 0.9; } to { transform: translateY(10px); opacity: 0; } }
      @keyframes draw { from { stroke-dashoffset: 100; } 70%, to { stroke-dashoffset: 0; } }
      @keyframes up { to { stroke-dashoffset: -14; } }
      @media (prefers-reduced-motion: reduce) { .pulse, .blink, .tx, .rx, .wire, .up, .scan, .drive, .draw { animation: none; } }
    </style>
  </defs>

  <!-- sky, snow, mountains -->
  <rect width="1200" height="560" fill="url(#sky)"/>
  <g fill="#ebe6f7" opacity="0.35">
    <circle cx="420" cy="40" r="1.6"/><circle cx="510" cy="96" r="1.2"/><circle cx="600" cy="30" r="2"/>
    <circle cx="690" cy="120" r="1.4"/><circle cx="760" cy="58" r="1.8"/><circle cx="850" cy="24" r="1.2"/>
    <circle cx="930" cy="100" r="1.6"/><circle cx="1010" cy="46" r="2"/><circle cx="1090" cy="130" r="1.2"/>
    <circle cx="1150" cy="70" r="1.6"/><circle cx="620" cy="140" r="1.2"/><circle cx="560" cy="170" r="1.6"/>
    <circle cx="980" cy="160" r="1.4"/><circle cx="30" cy="200" r="1.4"/><circle cx="1180" cy="210" r="1.8"/>
    <circle cx="320" cy="60" r="1.2"/><circle cx="1120" cy="20" r="1.4"/><circle cx="660" cy="200" r="1.2"/>
  </g>
  <path d="M0 250 L120 175 L200 215 L330 130 L450 210 L560 160 L700 225 L820 140 L930 200 L1050 120 L1200 205 L1200 300 L0 300 Z" fill="#1a1626"/>
  <path d="M310 142 L330 130 L352 146 L338 142 L326 152 Z M800 152 L820 140 L842 156 L828 151 L814 160 Z M1030 132 L1050 120 L1074 136 L1058 132 L1046 142 Z" fill="#4a4270"/>
  <path d="M0 290 L160 230 L300 270 L470 215 L620 262 L780 222 L960 268 L1100 228 L1200 260 L1200 320 L0 320 Z" fill="#221d33"/>

  <!-- title -->
  <text x="60" y="100" class="sans" font-size="72" font-weight="700" fill="#ebe6f7" letter-spacing="-1">Hypha</text>
  <text x="62" y="134" class="mono" font-size="17" fill="#b48cff">zero-copy shared-memory data plane</text>
  <text x="62" y="158" class="mono" font-size="17" fill="#7a7394">for mixed C++ and Rust robotics components</text>
  <!-- ROS 1 compatibility -->
  <g class="mono" font-size="13">
    <rect x="300" y="64" width="134" height="26" rx="13" fill="#2a2440"/>
    <rect x="444" y="64" width="172" height="26" rx="13" fill="#2a2440"/>
    <rect x="626" y="64" width="158" height="26" rx="13" fill="#2a2440"/>
    <text x="367" y="82" fill="#ebe6f7" text-anchor="middle"><tspan fill="#7cf5b4">ROS 1</tspan> messages</text>
    <text x="530" y="82" fill="#ebe6f7" text-anchor="middle"><tspan fill="#7cf5b4">ROS 1</tspan> wire encoding</text>
    <text x="705" y="82" fill="#ebe6f7" text-anchor="middle"><tspan fill="#7cf5b4">ROS</tspan>-like node API</text>
  </g>

  <!-- developer laptop running Foxglove -->
  <g>
    <rect x="900" y="22" width="230" height="130" rx="6" fill="#0b0912" stroke="#2a2440" stroke-width="2"/>
    <path d="M884 152 L1146 152 L1138 162 L892 162 Z" fill="#2a2440"/>
    <rect x="904" y="26" width="222" height="14" rx="2" fill="#1a1626"/>
    <text x="910" y="36" class="mono" font-size="8" fill="#ebe6f7">Foxglove</text>
    <circle cx="1093" cy="33" r="2.5" fill="#7cf5b4" class="blink" style="animation-duration: 1.2s"/>
    <text x="1120" y="36" class="mono" font-size="8" fill="#7cf5b4" text-anchor="end">live</text>
    <!-- 3D panel: point cloud with an obstacle -->
    <rect x="904" y="44" width="130" height="104" rx="2" fill="#120e1c"/>
    <g stroke="#5ec8ff" stroke-width="1.2" opacity="0.6">
      <line x1="916" y1="146" x2="964" y2="70"/><line x1="1022" y1="146" x2="974" y2="70"/>
    </g>
    <g class="drive">
      <circle cx="930" cy="120" r="1.2" fill="#7cf5b4"/><circle cx="1016" cy="96" r="1.2" fill="#5ec8ff"/>
      <circle cx="944" cy="84" r="1.2" fill="#b48cff"/><circle cx="1026" cy="66" r="1.2" fill="#ffc46b"/>
      <circle cx="1000" cy="136" r="1.2" fill="#7cf5b4"/><circle cx="926" cy="56" r="1.2" fill="#b48cff"/>
    </g>
    <g class="drive" style="animation-delay: -0.8s">
      <circle cx="1008" cy="118" r="1.2" fill="#7cf5b4"/><circle cx="920" cy="100" r="1.2" fill="#5ec8ff"/>
      <circle cx="996" cy="82" r="1.2" fill="#b48cff"/><circle cx="912" cy="70" r="1.2" fill="#ffc46b"/>
      <circle cx="938" cy="134" r="1.2" fill="#7cf5b4"/><circle cx="1014" cy="54" r="1.2" fill="#b48cff"/>
    </g>
    <rect x="904" y="46" width="130" height="1.5" fill="#5ec8ff" class="scan"/>
    <g fill="#ff5c8a"><circle cx="966" cy="86" r="1.6"/><circle cx="971" cy="83" r="1.6"/><circle cx="975" cy="87" r="1.6"/><circle cx="969" cy="90" r="1.6"/></g>
    <rect x="958" y="76" width="24" height="20" fill="none" stroke="#ff5c8a" stroke-width="1" class="blink" style="animation-duration: 0.9s"/>
    <!-- plot panel: speed over time -->
    <rect x="1038" y="44" width="88" height="50" rx="2" fill="#120e1c"/>
    <text x="1042" y="53" class="mono" font-size="7" fill="#7a7394">/odom speed</text>
    <polyline points="1042,64 1062,63 1076,64 1088,70 1100,80 1112,86 1122,88" pathLength="100" fill="none" stroke="#7cf5b4" stroke-width="1.5" class="draw"/>
    <!-- topic list -->
    <rect x="1038" y="98" width="88" height="50" rx="2" fill="#120e1c"/>
    <g class="mono" font-size="7" fill="#7a7394">
      <text x="1042" y="108">/lidar/points</text><text x="1042" y="118">/odom</text>
      <text x="1042" y="128">/cmd_vel</text><text x="1042" y="138">/diagnostics</text>
    </g>
    <g fill="#7cf5b4">
      <circle cx="1120" cy="106" r="2" class="blink" style="animation-duration: 0.3s"/>
      <circle cx="1120" cy="116" r="2" class="blink" style="animation-duration: 0.6s"/>
      <circle cx="1120" cy="126" r="2" class="blink" style="animation-duration: 1s"/>
      <circle cx="1120" cy="136" r="2" class="blink" style="animation-duration: 2s"/>
    </g>
  </g>
  <text x="908" y="180" class="mono" font-size="11" fill="#5ec8ff" text-anchor="end">developers debug live in Foxglove</text>

  <!-- ground -->
  <rect y="470" width="1200" height="90" fill="#120e1c"/>

  <!-- the host: one machine, one shared-memory domain -->
  <rect x="240" y="232" width="790" height="226" rx="18" fill="url(#glass)" stroke="#2a2440" stroke-width="3"/>
  <text x="262" y="256" class="mono" font-size="11" fill="#7a7394">one host</text>
  <g fill="#2a2440">
    <rect x="300" y="458" width="60" height="12" rx="3"/><rect x="910" y="458" width="60" height="12" rx="3"/>
  </g>

  <!-- ROS 1 graph outside the host, reached through hypha_ros_bridge -->
  <g>
    <rect x="40" y="315" width="130" height="60" rx="10" fill="#0b0912" stroke="#5ec8ff" stroke-width="1.5"/>
    <text x="105" y="341" class="mono" font-size="12" fill="#5ec8ff" text-anchor="middle">ROS 1 graph</text>
    <text x="105" y="359" class="mono" font-size="9" fill="#7a7394" text-anchor="middle">TCPROS, XML-RPC</text>
    <line x1="170" y1="345" x2="278" y2="345" stroke="#5ec8ff" stroke-width="1.5" class="wire"/>
  </g>

  <!-- WebSocket from the Foxglove bridge to the laptop -->
  <path d="M968 262 C990 220 1010 190 1015 164" fill="none" stroke="#5ec8ff" stroke-width="1.5" class="wire up"/>
    <!-- hyphae: main threads, publishers in, subscribers out -->
  <g>
    <g class="hypha main">
      <path id="h1" d="M418 294 C450 300 470 328 500 328"/>
      <path id="h2" d="M438 396 C470 390 480 358 500 358"/>
      <path id="h3" d="M730 334 C765 332 770 304 782 300"/>
      <path id="h4" d="M730 342 C810 346 880 360 932 360"/>
      <path id="h5" d="M730 352 C780 360 810 396 842 398"/>
      <path id="h7" d="M716 318 C760 240 880 250 942 278"/>
      <path id="h6" d="M500 343 C440 343 380 345 322 345"/>
    </g>
    <g class="hypha pulse" filter="url(#glow)">
      <use href="#h1"/><use href="#h2" class="slow"/><use href="#h3"/><use href="#h4" class="slow"/><use href="#h5"/><use href="#h6"/><use href="#h7" class="slow"/>
    </g>

    <!-- shared-memory segment with loaned slots -->
    <text x="615" y="308" class="mono" font-size="11" fill="#b48cff" text-anchor="middle">iceoryx2 shared memory</text>
    <rect x="500" y="318" width="230" height="48" rx="10" fill="#1a1626" stroke="#b48cff" stroke-width="2" filter="url(#glow)"/>
    <g>
      <rect x="514" y="329" width="20" height="26" rx="3" fill="#2a2440"/>
      <rect x="540" y="329" width="20" height="26" rx="3" fill="#7cf5b4" opacity="0.8"/>
      <rect x="566" y="329" width="20" height="26" rx="3" fill="#7cf5b4" opacity="0.8" class="blink"/>
      <rect x="592" y="329" width="20" height="26" rx="3" fill="#b48cff"/>
      <rect x="618" y="329" width="20" height="26" rx="3" fill="#2a2440"/>
      <rect x="644" y="329" width="20" height="26" rx="3" fill="#7cf5b4" opacity="0.8"/>
      <rect x="670" y="329" width="20" height="26" rx="3" fill="#2a2440"/>
      <rect x="696" y="329" width="20" height="26" rx="3" fill="#2a2440"/>
    </g>

    <!-- nodes -->
    <g class="mono" font-size="10" font-weight="700" text-anchor="middle">
      <g fill="#0f0c17" stroke-width="2" filter="url(#glow)">
        <circle cx="400" cy="290" r="18" stroke="#5ec8ff"/>
        <circle cx="420" cy="400" r="18" stroke="#ffc46b"/>
        <circle cx="800" cy="300" r="18" stroke="#5ec8ff"/>
        <circle cx="950" cy="360" r="18" stroke="#ffc46b"/>
        <circle cx="960" cy="280" r="18" stroke="#ffc46b"/>
        <circle cx="860" cy="398" r="18" stroke="#5ec8ff"/>
        <rect x="278" y="323" width="44" height="44" rx="9" stroke="#ffc46b"/>
      </g>
      <text x="400" y="294" fill="#5ec8ff">C++</text>
      <text x="420" y="404" fill="#ffc46b">RS</text>
      <text x="800" y="304" fill="#5ec8ff">C++</text>
      <text x="950" y="364" fill="#ffc46b">RS</text>
      <text x="960" y="284" fill="#ffc46b">RS</text>
      <text x="860" y="402" fill="#5ec8ff">C++</text>
      <text x="300" y="349" fill="#ffc46b">RS</text>
    </g>
    <g class="mono" font-size="11" fill="#7a7394" text-anchor="middle">
      <text x="400" y="324">lidar</text>
      <text x="420" y="434">odometry</text>
      <text x="800" y="334">planner</text>
      <text x="950" y="394">hypha top</text>
      <text x="930" y="284" text-anchor="end" fill="#ebe6f7">hypha foxglove</text>
      <text x="860" y="432">control</text>
      <text x="300" y="383" fill="#ebe6f7">hypha_ros_bridge</text>
    </g>
  </g>

  <!-- caption -->
  <g class="mono" font-size="13" fill="#7a7394">
    <text x="60" y="512">On one host, C++ and Rust nodes pass ROS 1 messages in loaned buffers: <tspan fill="#7cf5b4">no broker, no copies</tspan>.</text>
    <text x="60" y="536">Bridge processes connect the bus to <tspan fill="#5ec8ff">a ROS 1 graph and Foxglove</tspan>; network code stays out of the data plane.</text>
  </g>
</svg>
