# The compiler every build of this tree uses, locally, in CI and inside an
# application's FetchContent build: the latest stable, not pinned. Cargo.toml's
# rust-version is the oldest that builds the tree. docker/Dockerfile installs the
# same channel (HYPHA_RUST_VERSION); check.sh fails when the two differ.
[toolchain]
channel = "stable"
components = ["clippy", "rustfmt", "llvm-tools-preview"]
