# The compiler every build of this tree uses, locally, in CI and inside an
# application's FetchContent build: one exact version, so a new Rust release cannot
# turn a lint or a deprecation red with no change in the tree (#131). Moving it:
# CONTRIBUTING.md, "Moving the Rust toolchain". docker/Dockerfile installs the same
# version (HYPHA_RUST_VERSION) and Cargo.toml's rust-version is its major.minor;
# check.sh fails when the three differ.
[toolchain]
channel = "1.100.0"
components = ["clippy", "rustfmt", "llvm-tools-preview"]
